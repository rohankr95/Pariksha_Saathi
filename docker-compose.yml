name: pariksha-saathi

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pariksha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a strong password in .env}
      POSTGRES_DB: ${POSTGRES_DB:-pariksha_saathi}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pariksha}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  # One-off management commands (migrate, seed, ...). Builds from the
  # `builder` stage rather than the final pruned `runner` image — the
  # runner only keeps Next.js's traced production node_modules, which
  # excludes CLI-only tools like the `prisma` and `tsx` binaries that
  # these commands need but the running app itself never imports.
  #   docker compose run --rm migrate                                  # apply migrations
  #   docker compose run --rm --entrypoint "" migrate npx tsx prisma/seed.ts   # optional sample data
  migrate:
    build:
      context: .
      target: builder
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pariksha}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pariksha_saathi}
    depends_on:
      db:
        condition: service_healthy
    command: ["npx", "prisma", "migrate", "deploy"]
    networks: [internal]
    profiles: ["tools"]

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pariksha}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pariksha_saathi}
      PORT: "3000"
      # Force production mode regardless of what NODE_ENV is set to in .env
      # (.env.example defaults it to "development" for local `npm run dev`,
      # which would otherwise override the image's baked-in production value —
      # env_file entries lose to explicit `environment:` keys, so this wins).
      NODE_ENV: production
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [internal]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_webroot:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - app
    networks: [internal]

  # Run once to obtain the initial certificate, then rely on a host cron
  # job for renewal — see README §Deployment for both.
  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot_webroot:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    profiles: ["tools"]

networks:
  internal:

volumes:
  db_data:
  uploads:
  certbot_webroot:
  certbot_certs:
