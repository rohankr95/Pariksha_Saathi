# Bootstrap config — HTTP only. Use this BEFORE you have a TLS certificate
# yet (first deploy). It serves the ACME HTTP-01 challenge Certbot needs
# and proxies everything else to the app, so the site is reachable over
# plain HTTP while you obtain the certificate. Swap to nginx.conf once
# Certbot has issued it — see README §Deployment for the exact steps.

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.example;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
